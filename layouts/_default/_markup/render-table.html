{{- /* Wrap markdown tables so wide ones scroll inside .table-wrap instead of
      widening the page (styled in static/style.css and assets/tui.css). */ -}}
<div class="table-wrap">
  <table
    {{- range $k, $v := .Attributes }}
    {{- if $v }} {{ printf "%s=%q" $k $v | safeHTMLAttr }}{{ end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
