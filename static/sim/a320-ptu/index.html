he housing"}),(0,i.jsx)("p",{children:"Each end of the shaft carries a small axial-piston machine, drawn here in the bent-axis layout: a cylinder block set at an angle to the shaft, with pistons riding on a tilted drive plate. Pressure fills a cylinder and pushes its piston; the piston presses on the plate; the only way the tilted plate can give is to turn. Run the same parts backward and they pump: the shaft strokes the pistons, and fluid leaves at pressure. Which end plays motor and which plays pump depends only on which system is stronger, so the numbered callouts on the drawing swap sides when the transfer reverses. DETAIL A under the diagram is the same green end at 2.4:1, running live with every part named; slow it with TIME ¼× and follow one piston around. The production unit is the Eaton Vickers MPHV3-115-1C; the internals here are the generic textbook machine, not manufacturer drawings."}),(0,i.jsxs)("p",{children:["The sealed bulkhead is the reason this design exists. ",(0,i.jsx)("strong",{children:"Green fluid never touches yellow fluid."})," Each side of the PTU is wetted only by its own system; the shaft is the only part that crosses the wall, so the systems trade torque, never fluid. A leak in one system cannot drain the other through the PTU."]}),(0,i.jsxs)("p",{children:[(0,i.jsx)("strong",{children:"Try this:"})," in SINGLE-ENGINE TAXI, watch the balance needle: it drifts to a 500 mark, turns amber, and the unit fires, every single bark. Drag FLT CTL DEMAND and the bark tempo follows it on the strip recorder. Set TIME to ¼× and watch one engagement land: the gap opens, the pistons load up, the shaft helix starts to crawl, the lamp lights. Switch the PTU off and the yellow jack sags as its side bleeds down. GROUND SERVICE runs the whole unit in reverse: only the electric pump is on, so yellow drives green and every fluid column changes direction."]}),(0,i.jsx)("div",{className:"figures",children:"FIGURES: 3,000 PSI NOMINAL SYSTEM PRESSURE · PTU ENGAGES NEAR A 500 PSI DIFFERENTIAL · CUTS OUT AS THE LOW SYSTEM RECOVERS · EDP = ENGINE-DRIVEN PUMP. FLOW RATES AND TIME CONSTANTS ARE TUNED FOR LEGIBILITY, NOT TAKEN FROM CERTIFIED DATA. FLUID IS INCOMPRESSIBLE, SO COLUMNS ARE DRAWN AS SOLID SLUGS THAT MOVE AS ONE. PTU INTERNALS ARE A GENERIC BENT-AXIS SCHEMATIC."})]})]})},{})}));</script>
